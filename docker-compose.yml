name: workless

x-workless-image: &workless-image
  build:
    context: .
    dockerfile: .docker/node/Dockerfile
    target: production
  image: ${APP_IMAGE:-workless-app:production}

x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    <<: *workless-image
    restart: "no"
    init: true
    logging: *container-logging
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
    command: ["node", "dist/database/migration.runner.js", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  app:
    <<: *workless-image
    restart: unless-stopped
    init: true
    logging: *container-logging
    environment:
      APP_NAME: ${APP_NAME:-Workless}
      NODE_ENV: production
      PORT: 3000
      URL: ${URL:?Set URL in .env.production}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_SYNC: "false"
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      LOCALE: ${LOCALE:-en}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Workless}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The egress network permits SMTP and other outbound integrations. The app
    # still has no published host port; Caddy is its only public entry point.
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *container-logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./.docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Caddy needs this single capability to bind ports 80 and 443.
      - NET_BIND_SERVICE
    networks:
      - edge
      - backend

  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./.docker/db/sql:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  # Public ingress plus outbound access for application integrations.
  edge:
  # Database and Redis are never published to the host or the Internet.
  backend:
    internal: true
