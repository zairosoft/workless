<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | Workless - A progressive Node.js framework</title>
    <meta name="description" content="Workless is a framework for building efficient, scalable Node.js server-side applications built with TypeScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- PrismJS Theme (Tomorrow Night) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        /* ================================================================
           DESIGN SYSTEM – Dark theme inspired by docs.nestjs.com
           ================================================================ */
        :root {
            --bg-body: #111014;
            --bg-sidebar: #17151b;
            --bg-header: rgba(17, 16, 20, 0.85);
            --bg-surface: #1c1a22;
            --bg-code: #1a1820;
            --bg-code-header: #1e1c24;
            --bg-search: #1c1a22;
            --bg-hint: rgba(234, 40, 69, 0.06);
            --bg-hint-info: rgba(56, 139, 253, 0.08);
            --bg-hint-warning: rgba(227, 179, 65, 0.08);

            --text-main: #b0adb8;
            --text-heading: #eae9ed;
            --text-muted: #706d7a;
            --text-code: #d4d0dc;

            --primary: #ea2845;
            --primary-hover: #ff3d5c;
            --primary-glow: rgba(234, 40, 69, 0.15);
            --link-blue: #5b9cf5;
            --info-blue: #388bfd;
            --warning-yellow: #e3b341;

            --border-color: #272430;
            --border-subtle: #201e28;

            --sidebar-width: 280px;
            --toc-width: 220px;
            --header-height: 64px;

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;

            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
        }

        /* Light theme override */
        html.light {
            --bg-body: #ffffff;
            --bg-sidebar: #f8f8fa;
            --bg-header: rgba(255, 255, 255, 0.88);
            --bg-surface: #f4f4f6;
            --bg-code: #f6f5f8;
            --bg-code-header: #eeecf0;
            --bg-search: #f0eff2;
            --bg-hint: rgba(234, 40, 69, 0.05);
            --bg-hint-info: rgba(56, 139, 253, 0.06);
            --bg-hint-warning: rgba(227, 179, 65, 0.06);

            --text-main: #4a4858;
            --text-heading: #1a1826;
            --text-muted: #8a8798;
            --text-code: #3b3950;

            --border-color: #e4e2ea;
            --border-subtle: #eceaef;
        }

        /* ================================================================
           RESET & BASE
           ================================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333040; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4660; }

        /* ================================================================
           HEADER
           ================================================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background-color: var(--bg-header);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            width: var(--sidebar-width);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-heading);
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.3px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 16px;
        }

        .version-badge {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            margin-left: 4px;
        }

        .header-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .search-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-search);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 7px 14px;
            color: var(--text-muted);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            width: 280px;
            transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
        }
        .search-btn:hover {
            border-color: var(--text-muted);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .search-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

        .shortcut {
            margin-left: auto;
            display: flex;
            gap: 3px;
        }
        .shortcut kbd {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: inherit;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ================================================================
           SEARCH MODAL (NestJS-style ⌘K palette)
           ================================================================ */
        .search-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: min(20vh, 140px);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .search-overlay.open { display: flex; }

        .search-modal {
            width: 100%;
            max-width: 620px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
            overflow: hidden;
            animation: searchSlideIn 0.18s ease-out;
        }
        @keyframes searchSlideIn {
            from { opacity: 0; transform: scale(0.97) translateY(-8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Search input row */
        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-input-wrap svg {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-heading);
            caret-color: var(--primary);
        }
        .search-input::placeholder { color: var(--text-muted); }

        .search-input-esc {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        .search-input-esc:hover {
            color: var(--text-heading);
            border-color: var(--text-muted);
        }

        /* Search body */
        .search-body {
            max-height: 420px;
            overflow-y: auto;
            padding: 8px;
        }

        .search-section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 12px 14px 6px;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            transition: all var(--transition-fast);
        }
        .search-item:hover, .search-item.focused {
            background: var(--primary-glow);
            color: var(--text-heading);
        }
        .search-item:hover .search-item-icon,
        .search-item.focused .search-item-icon { color: var(--primary); }

        .search-item-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: color var(--transition-fast);
        }

        .search-item-content { flex: 1; min-width: 0; }
        .search-item-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }
        .search-item-path {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .search-item-arrow {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .search-item:hover .search-item-arrow,
        .search-item.focused .search-item-arrow { opacity: 1; }

        /* No results */
        .search-no-results {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            display: none;
        }
        .search-no-results svg {
            width: 40px;
            height: 40px;
            color: var(--border-color);
            margin-bottom: 12px;
        }

        /* Footer shortcuts */
        .search-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0,0,0,0.15);
        }

        .search-footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .search-footer-item kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0 4px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .search-footer-item kbd svg {
            width: 10px;
            height: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 16px;
        }

        .header-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color var(--transition-fast);
        }
        .header-nav a:hover { color: var(--text-heading); }

        .header-divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 8px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            transition: all var(--transition-fast);
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .icon-btn:hover {
            color: var(--text-heading);
            background: var(--bg-surface);
        }
        .icon-btn svg { width: 18px; height: 18px; }

        .icon-btn.active { color: var(--primary); }

        /* ================================================================
           LAYOUT
           ================================================================ */
        .layout {
            display: flex;
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
        }

        /* ================================================================
           SIDEBAR
           ================================================================ */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            overflow-y: auto;
            padding: 20px 16px 32px 20px;
            z-index: 40;
        }

        .nav-group { margin-bottom: 8px; }

        .nav-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 8px 8px 12px;
            color: var(--text-heading);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
            user-select: none;
        }
        .nav-group-title:hover { background: var(--bg-surface); }

        .nav-group-title .chevron {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            transition: transform var(--transition-normal);
            flex-shrink: 0;
        }
        .nav-group.collapsed .chevron { transform: rotate(-90deg); }
        .nav-group.collapsed .nav-list { display: none; }

        .nav-group-title .new-badge {
            background: var(--primary);
            color: white;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }

        .nav-list {
            list-style: none;
            margin-top: 2px;
            padding-left: 12px;
        }

        .nav-link {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            padding: 5px 12px;
            margin: 1px 0;
            border-left: 2px solid transparent;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            transition: all var(--transition-fast);
            line-height: 1.5;
            cursor: pointer;
        }
        .nav-link:hover {
            color: var(--text-heading);
            background: rgba(255,255,255,0.03);
        }
        .nav-link.active {
            color: var(--primary);
            border-left-color: var(--primary);
            background: var(--primary-glow);
            font-weight: 500;
        }

        /* ================================================================
           MAIN CONTENT
           ================================================================ */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            margin-right: var(--toc-width);
            display: flex;
            justify-content: center;
            padding: 40px 48px 80px;
        }

        .content {
            max-width: 780px;
            width: 100%;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb .sep { opacity: 0.4; }

        h1, .content h1 {
            color: var(--text-heading);
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .page-subtitle {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .content p {
            font-size: 15px;
            margin-bottom: 20px;
            color: var(--text-main);
            line-height: 1.75;
        }

        .content strong { color: var(--text-heading); font-weight: 600; }

        .content a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-fast);
        }
        .content a:hover { text-decoration: underline; }

        .highlight {
            color: var(--primary);
            font-weight: 500;
        }

        .content h2 {
            color: var(--text-heading);
            font-size: 22px;
            font-weight: 700;
            margin-top: 48px;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
            scroll-margin-top: calc(var(--header-height) + 24px);
        }

        .content h3 {
            color: var(--text-heading);
            font-size: 17px;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 12px;
            scroll-margin-top: calc(var(--header-height) + 24px);
        }

        /* ================================================================
           BLOCKQUOTE as hint/info/warning boxes
           ================================================================ */
        .content blockquote {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin: 24px 0;
            font-size: 14px;
            line-height: 1.65;
            background: var(--bg-hint-info);
            border-left: 3px solid var(--info-blue);
            color: var(--text-main);
        }
        .content blockquote strong { color: var(--text-heading); }
        .content blockquote code {
            background: rgba(255,255,255,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .content blockquote p {
            margin-bottom: 0;
        }

        /* ================================================================
           CODE BLOCKS (with language tabs like NestJS)
           ================================================================ */
        .content pre {
            margin: 24px 0;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            padding: 20px !important;
            background: var(--bg-code) !important;
            overflow-x: auto;
            position: relative;
        }

        .content pre code, .content code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.65;
            color: var(--text-code);
        }

        /* Inline code */
        .content p code, .content li code, .content blockquote code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12.5px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
        }

        /* ================================================================
           UNORDERED / ORDERED LIST
           ================================================================ */
        .content ul, .content ol {
            padding-left: 24px;
            margin-bottom: 20px;
        }
        .content ul li, .content ol li {
            margin-bottom: 8px;
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.7;
        }
        .content ul li::marker { color: var(--primary); }

        /* ================================================================
           TABLES
           ================================================================ */
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 14px;
        }
        .content table th, .content table td {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .content table th {
            background: var(--bg-surface);
            color: var(--text-heading);
            font-weight: 600;
        }
        .content table td {
            color: var(--text-main);
        }

        /* ================================================================
           IMAGES
           ================================================================ */
        .content img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin: 16px 0;
        }

        /* ================================================================
           FOOTER NAVIGATION
           ================================================================ */
        .page-footer {
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .footer-nav {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .footer-nav-link {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all var(--transition-normal);
            min-width: 0;
            cursor: pointer;
        }
        .footer-nav-link:hover {
            border-color: var(--primary);
            background: var(--primary-glow);
            text-decoration: none;
        }

        .footer-nav-link .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }
        .footer-nav-link .title {
            color: var(--primary);
            font-weight: 600;
            font-size: 15px;
        }
        .footer-nav-link.next { text-align: right; }

        /* Global footer */
        .global-footer {
            text-align: center;
            padding-bottom: 40px;
        }

        .global-footer-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .global-footer-icons a {
            color: var(--text-muted);
            transition: color var(--transition-fast);
            display: flex;
        }
        .global-footer-icons a:hover { color: var(--text-heading); }
        .global-footer-icons svg { width: 18px; height: 18px; }

        .global-footer-text {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 6px;
        }
        .global-footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .global-footer-text a:hover { text-decoration: underline; }

        /* ================================================================
           RIGHT TOC (On This Page)
           ================================================================ */
        .toc {
            width: var(--toc-width);
            position: fixed;
            top: var(--header-height);
            right: 0;
            bottom: 0;
            padding: 28px 20px;
            overflow-y: auto;
        }

        .toc-title {
            color: var(--text-heading);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .toc-list { list-style: none; }
        .toc-list li { margin-bottom: 1px; }

        .toc-link {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12.5px;
            padding: 4px 0 4px 14px;
            border-left: 2px solid var(--border-color);
            transition: all var(--transition-fast);
            line-height: 1.5;
        }
        .toc-link:hover { color: var(--text-main); }
        .toc-link.active {
            color: var(--primary);
            border-left-color: var(--primary);
        }
        .toc-link.toc-h3 {
            padding-left: 28px;
            font-size: 12px;
        }

        /* ================================================================
           LOADING STATE
           ================================================================ */
        .content-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .content-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .content-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .content-empty svg {
            width: 48px;
            height: 48px;
            color: var(--border-color);
            margin-bottom: 16px;
        }
        .content-empty h3 {
            color: var(--text-heading);
            margin-bottom: 8px;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 1200px) {
            .toc { display: none; }
            .main-wrapper { margin-right: 0; }
        }

        @media (max-width: 860px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
            .main-wrapper { margin-left: 0; padding: 24px 20px 60px; }
            .header-left { width: auto; }
            .search-btn { width: 200px; }
            .header-nav { display: none; }
            h1 { font-size: 28px; }
        }

        .mobile-menu-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            margin-right: 8px;
        }
        .mobile-menu-btn svg { width: 20px; height: 20px; }

        @media (max-width: 860px) {
            .mobile-menu-btn { display: flex; }
        }

    </style>
</head>

    <!-- ============================================================
         SEARCH MODAL (⌘K)
         ============================================================ -->
    <div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)closeSearch()">
        <div class="search-modal" role="dialog" aria-label="Search documentation">

    <div class="layout">

        <!-- ============================================================
             LEFT SIDEBAR (dynamically populated)

            <!-- Populated by JS from content.json -->

        <!-- ============================================================

        <main class="main-wrapper">

                    </div>

                <!-- ===== Footer Navigation ===== -->
                <div class="page-footer" id="pageFooter" style="display:none">

                    <!-- Global Footer -->
                    <div class="global-footer">
                        <div class="global-footer-icons">
                            <!-- GitHub -->
                            <a href="#" title="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg></a>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.4/marked.min.js"></script>

    <!-- PrismJS Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

    <script>
        // ============================================================
        // GLOBAL STATE
        // ============================================================
        let contentRegistry = null;   // loaded from content.json
        let allItems = [];            // flat list of { slug, label, file, sectionTitle }
        let currentSlug = null;
        let firstSlug = 'overview';

        // ============================================================
        // THEME
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.toggle('dark', !isDark);
            html.classList.toggle('light', isDark);
            document.querySelector('.theme-dark-icon').style.display = isDark ? 'none' : '';
            document.querySelector('.theme-light-icon').style.display = isDark ? '' : 'none';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Restore saved theme
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.querySelector('.theme-dark-icon').style.display = 'none';
                document.querySelector('.theme-light-icon').style.display = '';
            }
        })();

        // ============================================================
        // SEARCH MODAL
        // ============================================================
        const searchOverlay = document.getElementById('searchOverlay');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const searchNoResults = document.getElementById('searchNoResults');
        const searchNoResultsQuery = document.getElementById('searchNoResultsQuery');

        let focusedIndex = -1;
        let visibleSearchItems = [];

        function openSearch() {
            searchOverlay.classList.add('open');
            searchInput.value = '';
            filterSearchResults('');
            setTimeout(() => searchInput.focus(), 50);
            document.body.style.overflow = 'hidden';
        }

        function closeSearch() {
            searchOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        function filterSearchResults(query) {
            query = query.toLowerCase().trim();
            focusedIndex = -1;
            let hasMatch = false;

            const labels = searchResults.querySelectorAll('.search-section-label');
            labels.forEach(l => l.style.display = query ? 'none' : '');

            visibleSearchItems = [];
            const items = Array.from(searchResults.querySelectorAll('.search-item'));

            items.forEach(item => {
                item.classList.remove('focused');
                if (!query) {
                    item.style.display = '';
                    visibleSearchItems.push(item);
                    hasMatch = true;
                    return;
                }

                const keywords = item.getAttribute('data-keywords') || '';
                const text = item.textContent.toLowerCase();

                if (text.includes(query) || keywords.includes(query)) {
                    item.style.display = '';
                    visibleSearchItems.push(item);
                    hasMatch = true;
                } else {
                    item.style.display = 'none';
                }
            });

            if (hasMatch) {
                searchResults.style.display = '';
                searchNoResults.style.display = 'none';
                if (query && visibleSearchItems.length > 0) {
                    focusedIndex = 0;
                    visibleSearchItems[0].classList.add('focused');
                }
            } else {
                searchResults.style.display = 'none';
                searchNoResults.style.display = 'block';
                searchNoResultsQuery.textContent = query;
            }
        }

        // Global keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                openSearch();
            }
            if (e.key === 'Escape' && searchOverlay.classList.contains('open')) {
                closeSearch();
            }
        });

        searchInput.addEventListener('input', (e) => {
            filterSearchResults(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (visibleSearchItems.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (focusedIndex >= 0) visibleSearchItems[focusedIndex].classList.remove('focused');
                focusedIndex = (focusedIndex + 1) % visibleSearchItems.length;
                visibleSearchItems[focusedIndex].classList.add('focused');
                visibleSearchItems[focusedIndex].scrollIntoView({ block: 'nearest' });
            }
            else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (focusedIndex >= 0) visibleSearchItems[focusedIndex].classList.remove('focused');
                focusedIndex = (focusedIndex - 1 + visibleSearchItems.length) % visibleSearchItems.length;
                visibleSearchItems[focusedIndex].classList.add('focused');
                visibleSearchItems[focusedIndex].scrollIntoView({ block: 'nearest' });
            }
            else if (e.key === 'Enter' && focusedIndex >= 0) {
                e.preventDefault();
                visibleSearchItems[focusedIndex].click();
            }
        });

        // Close sidebar on mobile when clicking outside
        document.addEventListener('click', function(e) {
            const sidebar = document.querySelector('.sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        // ============================================================
        // MARKDOWN RENDERING (using Marked.js)
        // ============================================================

        // Configure Marked renderer to add IDs to headings
        const renderer = new marked.Renderer();
        renderer.heading = function({ tokens, depth }) {
            const text = this.parser.parseInline(tokens);
            const rawText = tokens.map(t => t.raw || t.text || '').join('');
            const slug = rawText.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
            return `<h${depth} id="${slug}">${text}</h${depth}>`;
        };

        marked.setOptions({
            renderer: renderer,
            gfm: true,
            breaks: false
        });

        // ============================================================
        // CONTENT LOADING
        // ============================================================

        async function loadContentRegistry() {
            try {
                const resp = await fetch('content/content.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                contentRegistry = await resp.json();

                // Build flat list
                allItems = [];
                contentRegistry.sections.forEach(section => {
                    section.items.forEach(item => {
                        allItems.push({
                            slug: item.slug,
                            label: item.label,
                            file: item.file,
                            sectionTitle: section.title
                        });
                    });
                });

                if (allItems.length > 0) {
                    firstSlug = allItems[0].slug;
                }

                buildSidebar();
                buildSearchItems();

                // Navigate to initial page from hash, or default
                const hash = window.location.hash.replace('#', '');
                const targetSlug = hash && allItems.find(i => i.slug === hash) ? hash : firstSlug;
                navigateTo(targetSlug);

            } catch (err) {
                console.error('Failed to load content.json:', err);
                document.getElementById('markdownContent').innerHTML = `
                    <div class="content-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <h3>Failed to load documentation</h3>
                        <p>Could not load content/content.json. Make sure you are serving this from a web server (not file://).</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // SIDEBAR BUILDER
        // ============================================================

        function buildSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            contentRegistry.sections.forEach(section => {
                const group = document.createElement('div');
                group.className = 'nav-group' + (section.collapsed ? ' collapsed' : '');

                // Title
                const titleEl = document.createElement('div');
                titleEl.className = 'nav-group-title';
                titleEl.onclick = () => group.classList.toggle('collapsed');

                let titleHTML = '';
                if (section.badge) {
                    titleHTML += `<span style="display:flex;align-items:center;gap:6px"><span class="new-badge">${section.badge}</span>${section.title}</span>`;
                } else {
                    titleHTML += section.title;
                }
                titleHTML += `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                titleEl.innerHTML = titleHTML;
                group.appendChild(titleEl);

                // Nav list
                const ul = document.createElement('ul');
                ul.className = 'nav-list';

                section.items.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.className = 'nav-link';
                    a.textContent = item.label;
                    a.href = '#' + item.slug;
                    a.setAttribute('data-slug', item.slug);
                    a.onclick = (e) => {
                        e.preventDefault();
                        navigateTo(item.slug);
                        // Close sidebar on mobile
                        document.querySelector('.sidebar').classList.remove('open');
                    };
                    li.appendChild(a);
                    ul.appendChild(li);
                });

                group.appendChild(ul);
                sidebar.appendChild(group);
            });
        }

        // ============================================================
        // SEARCH ITEMS BUILDER
        // ============================================================

        function buildSearchItems() {
            const container = document.getElementById('searchResults');
            // Keep the section label, remove old items
            const existingItems = container.querySelectorAll('.search-item');
            existingItems.forEach(i => i.remove());

            allItems.forEach(item => {
                const a = document.createElement('a');
                a.className = 'search-item';
                a.href = '#' + item.slug;
                a.setAttribute('data-keywords', item.label.toLowerCase() + ' ' + item.sectionTitle.toLowerCase() + ' ' + item.slug);
                a.onclick = (e) => {
                    e.preventDefault();
                    navigateTo(item.slug);
                    closeSearch();
                };

                a.innerHTML = `
                    <svg class="search-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <div class="search-item-content">
                        <div class="search-item-title">${item.label}</div>
                        <div class="search-item-path">${item.sectionTitle} › ${item.label}</div>
                    </div>
                    <svg class="search-item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                `;

                container.appendChild(a);
            });
        }

        // ============================================================
        // NAVIGATION
        // ============================================================

        async function navigateTo(slug) {
            const item = allItems.find(i => i.slug === slug);
            if (!item) return;

            currentSlug = slug;
            window.location.hash = slug;

            // Update sidebar active state
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.getAttribute('data-slug') === slug);
            });

            // Expand the parent nav-group
            document.querySelectorAll('.nav-link.active').forEach(link => {
                const group = link.closest('.nav-group');
                if (group) group.classList.remove('collapsed');
            });

            // Update breadcrumb
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = `
                <a href="#" onclick="event.preventDefault(); navigateTo('${firstSlug}')">Docs</a>
                <span class="sep">›</span>
                <span>${item.sectionTitle}</span>
                <span class="sep">›</span>
                <span>${item.label}</span>
            `;

            // Update page title
            document.title = `${item.label} | Workless Documentation`;

            // Load markdown
            await loadMarkdown(item.file);

            // Scroll to top
            window.scrollTo(0, 0);
        }

        async function loadMarkdown(filePath) {
            const container = document.getElementById('markdownContent');

            // Show loading
            container.innerHTML = `
                <div class="content-loading">
                    <div class="spinner"></div>
                    Loading documentation…
                </div>
            `;

            try {
                const resp = await fetch(filePath);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const md = await resp.text();

                if (!md.trim()) {
                    container.innerHTML = `
                        <div class="content-empty">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            <h3>Coming soon</h3>
                            <p>This page doesn't have content yet. Add markdown to the file to see it here.</p>
                        </div>
                    `;
                    document.getElementById('pageFooter').style.display = 'block';
                    buildFooterNav();
                    buildTOC();
                    return;
                }

                // Parse and render markdown
                const html = marked.parse(md);
                container.innerHTML = html;

                // Apply PrismJS syntax highlighting to code blocks
                container.querySelectorAll('pre code').forEach(block => {
                    Prism.highlightElement(block);
                });

                // Show footer and build nav
                document.getElementById('pageFooter').style.display = 'block';
                buildFooterNav();
                buildTOC();

            } catch (err) {
                console.error('Failed to load markdown:', err);
                container.innerHTML = `
                    <div class="content-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <h3>Error loading page</h3>
                        <p>Could not load ${filePath}.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // FOOTER NAVIGATION (prev/next)
        // ============================================================

        function buildFooterNav() {
            const footerNav = document.getElementById('footerNav');
            const currentIndex = allItems.findIndex(i => i.slug === currentSlug);

            footerNav.innerHTML = '';

            if (currentIndex > 0) {
                const prev = allItems[currentIndex - 1];
                const link = document.createElement('a');
                link.className = 'footer-nav-link';
                link.href = '#' + prev.slug;
                link.onclick = (e) => { e.preventDefault(); navigateTo(prev.slug); };
                link.innerHTML = `<span class="label">Previous</span><span class="title">← ${prev.label}</span>`;
                footerNav.appendChild(link);
            } else {
                footerNav.appendChild(document.createElement('div'));
            }

            if (currentIndex < allItems.length - 1) {
                const next = allItems[currentIndex + 1];
                const link = document.createElement('a');
                link.className = 'footer-nav-link next';
                link.href = '#' + next.slug;
                link.onclick = (e) => { e.preventDefault(); navigateTo(next.slug); };
                link.innerHTML = `<span class="label">Next</span><span class="title">${next.label} →</span>`;
                footerNav.appendChild(link);
            }
        }

        // ============================================================
        // TABLE OF CONTENTS (auto-generated from rendered headings)
        // ============================================================

        function buildTOC() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';

            const container = document.getElementById('markdownContent');
            const headings = container.querySelectorAll('h1, h2, h3');

            headings.forEach(h => {
                if (!h.id && h.tagName === 'H1') {
                    // Use the text as id for h1
                    h.id = h.textContent.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
                }
                if (!h.id) return;

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'toc-link' + (h.tagName === 'H3' ? ' toc-h3' : '');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                a.onclick = (e) => {
                    e.preventDefault();
                    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // Update hash without full reload
                    history.replaceState(null, '', '#' + currentSlug);
                };
                li.appendChild(a);
                tocList.appendChild(li);
            });

            // Active TOC tracking
            setupTocScrollSpy();
        }

        function setupTocScrollSpy() {
            const container = document.getElementById('markdownContent');
            const headings = Array.from(container.querySelectorAll('h1[id], h2[id], h3[id]'));
            const tocLinks = Array.from(document.querySelectorAll('.toc-link'));

            if (!headings.length || !tocLinks.length) return;

            const onScroll = () => {
                let current = '';
                headings.forEach(h => {
                    const top = h.getBoundingClientRect().top;
                    if (top < 120) current = h.id;
                });
                tocLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    link.classList.toggle('active', href === '#' + current);
                });
            };

            // Remove previous listener if any
            if (window._tocScrollHandler) {
                window.removeEventListener('scroll', window._tocScrollHandler);
            }
            window._tocScrollHandler = onScroll;
            window.addEventListener('scroll', onScroll, { passive: true });
        }

        // ============================================================
        // HASH CHANGE HANDLER
        // ============================================================

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && hash !== currentSlug && allItems.find(i => i.slug === hash)) {
                navigateTo(hash);
            }
        });

        // ============================================================
        // INIT
        // ============================================================

        loadContentRegistry();

    </script>

</body>
